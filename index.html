<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
 
<title>Oggi Planner V4</title>
 
<link rel="manifest" href="manifest.webmanifest">
 
<style>
 
*{
box-sizing:border-box;
}
 
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f7fb;
color:#1e293b;
}
 
header{
background:#2563eb;
color:white;
padding:20px;
}
 
main{
max-width:900px;
margin:auto;
padding:15px;
}
 
.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}
 
h1,h2,h3{
margin-top:0;
}
 
input,
button,
select{
font:inherit;
}
 
input,
select{
width:100%;
padding:10px;
border:1px solid #d1d5db;
border-radius:10px;
margin-top:5px;
margin-bottom:10px;
}
 
button{
background:#2563eb;
color:white;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}
 
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
 
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}
 
.day{
background:#eef2ff;
padding:12px;
border-radius:10px;
text-align:center;
cursor:pointer;
}
 
.today{
background:#2563eb;
color:white;
font-weight:bold;
}
 
.event{
background:#f8fafc;
padding:10px;
border-radius:10px;
margin-top:8px;
}
 
.shopping-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
margin-top:6px;
background:#f8fafc;
border-radius:10px;
}
 
.small{
font-size:13px;
color:#64748b;
}
 
</style>
</head>
 
<body>
 
<header>
 
<h1>Oggi Planner V4</h1>
 
<div id="today"></div>
 
</header>
 
<main>
 
<div class="card">
 
<h2>Orario di lavoro</h2>
 
<div class="grid">
 
<div>
<label>Inizio</label>
<input type="time" id="workStart">
</div>
 
<div>
<label>Fine</label>
<input type="time" id="workEnd">
</div>
 
</div>
 
<button id="saveWork">
Salva orario
</button>
 
</div>
 
<div class="card">
 
<h2>Calendario</h2>
 
<h3 id="monthLabel"></h3>
 
<div id="calendar" class="calendar"></div>
 
</div>
 
<div class="card">
 
<h2>Nuovo evento</h2>
 
<input id="eventTitle" placeholder="Titolo evento">
 
<div class="grid">
 
<input id="eventDate" type="date">
 
<input id="eventTime" type="time">
 
</div>
 
<button id="saveEvent">
Aggiungi evento
</button>
 
</div>
 
<div class="card">
 
<h2>Eventi</h2>
 
<div id="events"></div>
 
</div>
 
<div class="card">
 
<h2>Lista della spesa</h2>
 
<input id="product" placeholder="Nuovo prodotto">
 
<button id="addProduct">
Aggiungi prodotto
</button>
 
<div id="shopping"></div>
 
</div>
 
</main>
 
<script>
 
const events =
JSON.parse(localStorage.getItem("events") || "[]");
 
function saveEvents() {
localStorage.setItem(
"events",
JSON.stringify(events)
);
}
 
document.getElementById("today").textContent =
new Date().toLocaleDateString(
"it-IT",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
);
 
function renderCalendar() {
 
const calendar =
document.getElementById("calendar");
 
calendar.innerHTML = "";
 
const now = new Date();
 
const year = now.getFullYear();
const month = now.getMonth();
 
const monthName =
new Intl.DateTimeFormat(
"it-IT",
{
month:"long",
year:"numeric"
}
).format(now);
 
document.getElementById(
"monthLabel"
).textContent = monthName;
 
const daysInMonth =
new Date(year, month + 1, 0).getDate();
 
for(let day=1; day<=daysInMonth; day++){
 
const d = document.createElement("div");
 
d.className = "day";
 
if(day === now.getDate()){
d.classList.add("today");
}
 
d.textContent = day;
 
calendar.appendChild(d);
 
}
 
}
 
function renderEvents() {
 
const container =
document.getElementById("events");
 
container.innerHTML = "";
 
events.forEach((event,index)=>{
 
container.innerHTML += `
<div class="event">
 
<b>${event.title}</b><br>
 
${event.date}
${event.time}
 
<br><br>
 
<button onclick="deleteEvent(${index})">
Elimina
</button>
 
</div>
`;
 
});
 
}
 
function deleteEvent(index){
 
events.splice(index,1);
 
saveEvents();
 
renderEvents();
 
}
 
document.getElementById(
"saveEvent"
).onclick = () => {
 
const title =
document.getElementById(
"eventTitle"
).value;
 
const date =
document.getElementById(
"eventDate"
).value;
 
const time =
document.getElementById(
"eventTime"
).value;
 
if(!title) return;
 
events.push({
title,
date,
time
});
 
saveEvents();
 
renderEvents();
 
document.getElementById(
"eventTitle"
).value = "";
 
};
 
renderCalendar();
renderEvents();
 
</script>
