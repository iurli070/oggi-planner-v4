<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oggi Planner V4</title>
 
<link rel="manifest" href="manifest.webmanifest">
 
<style>
*{box-sizing:border-box}
 
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f5f7fb;
color:#152033;
}
 
header{
background:#2563eb;
color:white;
padding:20px;
}
 
main{
max-width:900px;
margin:auto;
padding:15px;
}
 
.card{
background:white;
border-radius:18px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}
 
button{
background:#2563eb;
color:white;
border:none;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
}
 
input,select{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:10px;
}
 
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}
 
.day{
background:#eef3ff;
padding:12px 0;
text-align:center;
border-radius:10px;
cursor:pointer;
}
 
.today{
background:#2563eb;
color:white;
font-weight:bold;
}
 
.event{
padding:10px;
background:#eef3ff;
border-radius:10px;
margin-top:8px;
}
 
.shopping-item{
display:flex;
justify-content:space-between;
padding:8px;
margin-top:5px;
background:#f1f5f9;
border-radius:10px;
}
 
.small{
font-size:14px;
color:#64748b;
}
 
h1,h2{
margin-top:0;
}
</style>
</head>
 
<body>
 
<header>
<h1>Oggi Planner V4</h1>
<div id="today"></div>
</header>
 
<main>
 
<div class="card">
 
<h2>⚙️ Orario di lavoro</h2>
 
<label>Inizio</label>
<input type="time" id="workStart">
 
<label>Fine</label>
<input type="time" id="workEnd">
 
<button id="saveWork">
Salva
</button>
 
</div>
 
<div class="card">
 
<h2>📅 Calendario</h2>
 
<h3 id="monthLabel"></h3>
 
<div class="calendar" id="calendar"></div>
 
</div>
 
<div class="card">
 
<h2>➕ Nuovo evento</h2>
 
<input id="eventTitle" placeholder="Titolo evento">
 
<input id="eventDate" type="date">
 
<input id="eventTime" type="time">
 
<button id="saveEvent">
Aggiungi evento
</button>
 
</div>
 
<div class="card">
 
<h2>🗓️ Eventi</h2>
 
<div id="events"></div>
 
</div>
 
<div class="card">
 
<h2>🛒 Lista della spesa</h2>
 
<input id="product">
 
<button id="addProduct">
Aggiungi prodotto
</button>
 
<div id="shopping"></div>
 
</div>
 
</main>
 
<script>
 
const events =
JSON.parse(localStorage.getItem("events")||"[]");
 
const shopping =
JSON.parse(localStorage.getItem("shopping")||"[]");
 
const today =
new Date();
 
document.getElementById("today").innerText =
today.toLocaleDateString("it-IT",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});
 
function renderCalendar(){
 
const calendar =
document.getElementById("calendar");
 
calendar.innerHTML="";
 
const now=new Date();
 
const year=now.getFullYear();
 
const month=now.getMonth();
 
document.getElementById("monthLabel")
.innerText=
new Intl.DateTimeFormat(
'it-IT',
{month:'long',year:'numeric'}
).format(now);
 
const days=
new Date(year,month+1,0).getDate();
 
for(let i=1;i<=days;i++){
 
const d=document.createElement("div");
 
d.className="day";
 
if(
i===today.getDate()
){
d.classList.add("today");
}
 
d.innerText=i;
 
calendar.appendChild(d);
 
}
 
}
 
function renderEvents(){
 
const container=
document.getElementById("events");
 
container.innerHTML="";
 
events.forEach((e,index)=>{
 
container.innerHTML+=`
<div class="event">
<b>${e.title}</b><br>
<span class="small">
${e.date} ${e.time}
</span>
<br><br>
<button onclick="removeEvent(${index})">
Elimina
</button>
</div>
`;
 
});
 
}
 
function renderShopping(){
 
const container=
document.getElementById("shopping");
 
container.innerHTML="";
 
shopping.forEach((item,index)=>{
 
container.innerHTML+=`
<div class="shopping-item">
${item}
<button onclick="removeProduct(${index})">
X
</button>
</div>
`;
 
});
 
}
 
function removeEvent(index){
 
events.splice(index,1);
 
localStorage.setItem(
"events",
JSON.stringify(events)
);
 
renderEvents();
 
}
 
function removeProduct(index){
 
shopping.splice(index,1);
 
localStorage.setItem(
"shopping",
JSON.stringify(shopping)
);
 
renderShopping();
 
}
 
document.getElementById(
"saveEvent"
).onclick=()=>{
 
events.push({
 
title:
document.getElementById(
"eventTitle"
).value,
 
date:
document.getElementById(
"eventDate"
).value,
 
time:
document.getElementById(
"eventTime"
).value
 
});
 
localStorage.setItem(
"events",
JSON.stringify(events)
);
 
renderEvents();
 
};
 
document.getElementById(
"addProduct"
).onclick=()=>{
 
const value=
document.getElementById(
"product"
).value;
 
shopping.push(value);
 
localStorage.setItem(
"shopping",
JSON.stringify(shopping)
);
 
renderShopping();
 
};
 
document.getElementById(
"saveWork"
).onclick=()=>{
 
localStorage.setItem(
"workStart",
document.getElementById(
"workStart"
).value
);
 
localStorage.setItem(
"workEnd",
document.getElementById(
"workEnd"
).value
);
 
alert("Orario salvato");
 
};
 
document.getElementById(
"workStart"
).value=
localStorage.getItem("workStart")
||"08:30";
